apis:
- aid: base-l2:mainnet-rpc
  name: Base Mainnet JSON-RPC
  description: >-
    Standard Ethereum JSON-RPC endpoint for Base Mainnet (chain ID 8453). Supports eth_*, net_*, web3_*,
    and Optimism-specific extensions for fee estimation and L1 messaging. The public endpoint is rate-limited
    and not recommended for production; teams typically front it with Alchemy, QuickNode, Infura, Coinbase
    Developer Platform, or self-hosted op-geth + op-node.
  humanURL: https://docs.base.org/chain/network-information
  baseURL: https://mainnet.base.org
  tags:
  - JSON-RPC
  - Mainnet
  - EVM
  properties:
  - type: Documentation
    url: https://docs.base.org/chain/network-information
  - url: graphql/base-l2-graphql.md
    type: GraphQL
- aid: base-l2:sepolia-rpc
  name: Base Sepolia JSON-RPC
  description: >-
    Public JSON-RPC endpoint for the Base Sepolia testnet (chain ID 84532) used for development, contract
    deployment, and integration testing.
  humanURL: https://docs.base.org/chain/network-information
  baseURL: https://sepolia.base.org
  tags:
  - JSON-RPC
  - Testnet
  - Sepolia
  properties:
  - type: Documentation
    url: https://docs.base.org/chain/network-information
- aid: base-l2:flashblocks-rpc
  name: Base Flashblocks RPC
  description: >-
    Pre-confirmation JSON-RPC endpoint exposing Flashblocks — sub-block streams of ordered transactions
    that allow apps to react to pending state with sub-second latency.
  humanURL: https://docs.base.org/chain/flashblocks
  baseURL: https://mainnet-preconf.base.org
  tags:
  - Flashblocks
  - Pre-Confirmation
  - JSON-RPC
  properties:
  - type: Documentation
    url: https://docs.base.org/chain/flashblocks
- aid: base-l2:bridge
  name: Base Bridge
  description: >-
    Canonical cross-chain bridge between Ethereum L1 and Base L2 for depositing and withdrawing ETH and
