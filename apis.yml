  - L1
  - L2
  - Canonical
  properties:
  - type: Documentation
    url: https://docs.base.org/chain/bridges-mainnet
  - type: App
    url: https://bridge.base.org
- aid: base-l2:solana-bridge
  name: Base / Solana Bridge
  description: >-
